trigger:
  branches:
    include:
      - main
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  azureSubscription: 'cloudorders-azure-connection'
  webAppName: 'cloudorders-api-escasan'

stages:
  - stage: Build
    jobs:
      - job: BuildAndTest
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '10.0.x'

          - script: dotnet restore
            displayName: 'Restore'

          - script: dotnet build --no-restore --configuration $(buildConfiguration)
            displayName: 'Build'

          - script: dotnet test --no-build --configuration $(buildConfiguration)
            displayName: 'Test'

          - script: dotnet publish src/CloudOrders.Api --no-build --configuration $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)
            displayName: 'Publish'

          - publish: $(Build.ArtifactStagingDirectory)
            artifact: drop

  - stage: Deploy
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployToAzure
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: 'webAppLinux'
                    appName: $(webAppName)
                    package: '$(Pipeline.Workspace)/drop'