trigger:
  branches:
    include: [main]

pool:
  vmImage: windows-latest

steps:
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      version: 10.0.x
  - script: dotnet test Inventory/Inventory.Tests/Inventory.Tests.csproj --configuration Release
    displayName: Run unit tests
  - script: dotnet publish Inventory/Inventory.csproj --configuration Release --output $(Build.ArtifactStagingDirectory)
    displayName: Publish application
