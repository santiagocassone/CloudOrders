trigger:
  branches:
    include:
      - main
      - master
  paths:
    include:
      - Inventory/**
    exclude:
      - src/**
      - tests/**

pr:
  branches:
    include:
      - main
      - master
  paths:
    include:
      - Inventory/**

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

stages:
  - stage: Build
    jobs:
      - job: BuildTestPublishInventory
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '10.0.x'

          - script: dotnet restore Inventory/Inventory.csproj
            displayName: 'Restore Inventory'

          - script: dotnet build Inventory/Inventory.csproj --no-restore --configuration $(buildConfiguration)
            displayName: 'Build Inventory'

          - script: dotnet test Inventory/Inventory.Tests/Inventory.Tests.csproj --configuration $(buildConfiguration)
            displayName: 'Test Inventory'

          - script: dotnet publish Inventory/Inventory.csproj --no-build --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)
            displayName: 'Publish Inventory'

          - publish: $(Build.ArtifactStagingDirectory)
            artifact: inventory-drop
